include:
  - ./docker-compose-base.yml

services:
  # ==========================================
  # MICROSERVICES
  # ==========================================

  # 1. Identity Service (NestJS) - Port 3001
  identity-service:
    image: docker-identity-service:latest
    build:
      context: ../backend/node-services/identity-service
      dockerfile: Dockerfile
    container_name: rag-identity-service
    restart: always
    ports:
      - "3010:3000"
    volumes:
      - ../backend/node-services/identity-service:/usr/src/app
      - /app/node_modules 
    command: npm run start:dev
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://root:${MYSQL_PASSWORD}@mysql:3306/identity_db"
      NODE_ENV: "development"
      PORT: 3000
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ragflow 
      # services:

