# ----------------------------------------
# CORE APPLICATION
# ----------------------------------------
spring.application.name=retrieval-service
server.port=8080

# ----------------------------------------
# MYSQL CONFIGURATION
# ----------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/ragflow_retrieval?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:infini_rag_flow}

# JPA Settings
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=false

# MYSQL CONFIGURATION
#spring.datasource.url=jdbc:mysql://localhost:3306/rag_flow
#spring.datasource.username=root
#spring.datasource.password=infini_rag_flow
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# ----------------------------------------
# REDIS CONFIGURATION (Caching)
# ----------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:infini_rag_flow}

# ----------------------------------------
# ELASTICSEARCH CONFIGURATION (Vector DB)
# ----------------------------------------
#elasticsearch.uris=http://${ES_HOST:localhost}:9200
#elasticsearch.password=${ES_PASSWORD:}
elasticsearch.host=${ELASTICSEARCH_HOST:localhost}
elasticsearch.port=${ES_PORT:1200}
elasticsearch.scheme=${ELASTICSEARCH_SCHEME:http}
elasticsearch.username=${ELASTICSEARCH_USERNAME:elastic}
elasticsearch.password=${ELASTIC_PASSWORD:infini_rag_flow}
elasticsearch.connect-timeout=3s
elasticsearch.socket-timeout=10s
rag.elasticsearch.index-prefix=ragflow_

# --------------------------------------    --
# SECURITY / JWT
# ----------------------------------------
security.jwt.secret=${JWT_SECRET:your_local_256_bit_secret_key_here}
tenant.dev-default-id=tenant-dev-123
security.jwt.role-claim-key=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health
security.excluded-paths=http://schemas.microsoft.com/ws/2008/06/identity/claims/role

# ----------------------------------------
# SWAGGER / OPENAPI UI
# ----------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html


search.similarity-threshold=0.75
search.keyword-weight=0.30
search.semantic-weight=0.70

retrieval.sanitize.max-query-length=1000

# ==========================================================
# ACTUATOR / HEALTH
# ==========================================================
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,metrics,prometheus

management.health.group.readiness.include=readinessState,elasticsearch

# ==========================================================
# AsyncConfig for feedback
# ==========================================================
feedback.executor.core-pool-size=10
feedback.executor.max-pool-size=50
feedback.executor.queue-capacity=500
feedback.executor.keep-alive-seconds=60
feedback.executor.await-termination-seconds=30

# ==========================================================
# RECIPROCAL RANK FUSION
# ==========================================================
# Bound and validated at startup by config/RetrievalProperties.Rrf.
# Rank constant for RRF scoring: 1 / (k + rank). A higher k flattens the
# influence of the top ranks. Minimum value is 1.
retrieval.rrf.k=60

# ==========================================================
# RE-RANKING
# ==========================================================
# Bound and validated at startup by config/RetrievalProperties.Rerank; an
# invalid value here fails the context rather than surfacing on a request.
# How many candidates from the head of the RRF order are sent to the rerank
# provider. Cost is one cross-encoder pass per candidate, so this is the
# dominant latency dial of the retrieval pipeline. Minimum value is 1.
retrieval.rerank.top-n=50
# Rerank model provider root; the client appends /rerank.
retrieval.rerank.base-url=http://localhost:9380
# A provider that is slow or down must not slow the search down indefinitely:
# on timeout the service fails open to the RRF order. read-timeout-ms MUST stay
# below the caller's request budget, otherwise the caller times out first and
# the fail-open fallback never gets to run.
retrieval.rerank.connect-timeout-ms=2000
retrieval.rerank.read-timeout-ms=4000


# Google Gemini
#gemini.api-key=A
gemini.embedding-model=gemini-embedding-001
gemini.embedding-url=https://generativelanguage.googleapis.com/v1beta
gemini.embedding-dimension=3072
gemini.connect-timeout=30s
gemini.read-timeout=60s


# ==================================================================
# Queue
# ==================================================================
spring.rabbitmq.host= ${RABBITMQ_HOST:localhost}
spring.rabbitmq.port= ${RABBITMQ_PORT:5672}
spring.rabbitmq.username= ${RABBITMQ_USER:guest}
spring.rabbitmq.password= ${RABBITMQ_PASSWORD:guest}

rag.queue.index-jobs-name=index-jobs
rag.queue.index-jobs-concurrency=5

# ==================================================================
# Minio
# ==================================================================
rag.minio.endpoint=http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
rag.minio.access-key=${MINIO_USER:rag_flow}
rag.minio.secret-key=${MINIO_PASSWORD:infini_rag_flow}


#===================================================================
#LLM- Gatway-Service
#===================================================================
rag.embedding-service.base-url=http://localhost:3003
rag.embedding-service.batch-size=32
rag.embedding-service.timeout-ms=30000