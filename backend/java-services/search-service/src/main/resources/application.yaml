spring:
  application:
    name: search-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/search_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:infini_rag_flow}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:infini_rag_flow}

server:
  port: 9407

# JWT Security
jwt:
  secret: ${JWT_SECRET:your_local_256_bit_secret_key_here_minimum_32_chars}

# Downstream Microservices
services:
  rag:
    url: ${RAG_SERVICE_URL:http://localhost:9405}
  chat:
    url: ${CHAT_SERVICE_URL:http://localhost:9406}
  timeout-ms: 5000

# Rate Limiting
rate:
  limit:
    requests: 100
    duration-seconds: 60

# Swagger / OpenAPI UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Logging
logging:
  level:
    com.ragflow: DEBUG
    org.springframework.security: INFO