spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      password:

# Test JWT Secret
jwt:
  secret: test_jwt_secret_key_must_be_at_least_32_bytes_long_for_hs256

# Downstream Microservices Mock URLs
services:
  rag:
    url: http://localhost:9405
  chat:
    url: http://localhost:9406
  timeout-ms: 5000

# Rate Limiting Mock
rate:
  limit:
    requests: 100
    duration-seconds: 60

logging:
  level:
    com.ragflow: DEBUG