# ----------------------------------------
# CORE APPLICATION
# ----------------------------------------
spring.application.name=document-service
server.port=8080

# ----------------------------------------
# MYSQL CONFIGURATION
# ----------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:5455}/document_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:infini_rag_flow}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# JPA
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# ----------------------------------------
# SWAGGER / OPENAPI UI
# ----------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html

# ----------------------------------------
# FEIGN CLIENT
# ----------------------------------------
#eureka.client.service-url.default-zone=http://localhost:8761/eureka
#eureka.client.registry-fetch-interval-seconds=30
#eureka.client.fetch-registry=true
#eureka.client.register-with-eureka=true

app.max-file-num-per-user=100