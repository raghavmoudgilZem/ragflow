
server.port=8081

# MYSQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:5455/identity_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:infini_rag_flow}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:infini_rag_flow}

# JWT
tenant.dev-default-id=tenant-dev-123
security.secret=${JWT_SECRET:your_local_256_bit_secret_key_here}
security.role-claim-key=http://schemas.microsoft.com/ws/2008/06/identity/claims/role
security.excluded-paths=/v1/user/register,/v1/user/login,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/actuator/health
# Swagger
springdoc.swagger-ui.path=/swagger-ui.html