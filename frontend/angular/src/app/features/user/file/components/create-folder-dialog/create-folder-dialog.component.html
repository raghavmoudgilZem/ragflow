<h2 mat-dialog-title>New Folder</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="folderName" placeholder="Please input name" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" class="cancel-btn">Cancel</button>
  <button mat-flat-button class="save-btn" (click)="onSave()" [disabled]="!folderName.trim()">
    Save
  </button>
</mat-dialog-actions>
