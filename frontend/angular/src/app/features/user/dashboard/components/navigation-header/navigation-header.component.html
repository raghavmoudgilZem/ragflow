<header class="navigation-header">
  <div class="nav-container">
    <!-- Logo Section -->
    <div class="brand-section">
      <button class="brand-logo-btn" (click)="navigateToHome()" aria-label="Go to home">
        <img src="/logo.svg" alt="RAGFlow Logo" class="brand-logo" />
      </button>
    </div>

    <!-- Segmented Navigation Control -->
    <div class="segmented-control">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" class="segment-item" [class.active]="isActive(item.path)">
          @if (item.isHome) {
            <mat-icon class="segment-icon">{{ item.icon }}</mat-icon>
          } @else {
            <span class="segment-label">{{ item.label }}</span>
          }
        </a>
      }
    </div>

    <!-- Right Section (Actions) -->
    <div class="nav-actions">
      <!-- Discord -->
      <a
        href="https://discord.com/invite/NjYzJD3GM3"
        target="_blank"
        rel="noopener noreferrer"
        class="action-link"
        matTooltip="Discord Community"
      >
        <mat-icon class="action-icon">forum</mat-icon>
      </a>

      <!-- GitHub -->
      <a
        href="https://github.com/infiniflow/ragflow"
        target="_blank"
        rel="noopener noreferrer"
        class="action-link"
        matTooltip="GitHub Repository"
      >
        <mat-icon class="action-icon">code</mat-icon>
      </a>

      <!-- Notifications Bell (conditional) -->
      @if (hasNotifications) {
        <button mat-icon-button class="action-link notification-btn" matTooltip="Notifications">
          <mat-icon class="action-icon">notifications</mat-icon>
